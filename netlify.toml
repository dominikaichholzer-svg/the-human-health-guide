[build]
  publish = "."
  functions = "netlify/functions"

[functions."scheduled-strategy-reminder"]
  schedule = "0 6 * * *"

[functions."scheduled-weekly-insight"]
  schedule = "0 7 * * *"

[functions."scheduled-missing-week-push"]
  schedule = "0 15 * * *"

# JARVIS Morgen-Briefing per Telegram, 05:30 UTC = 06:30 Wien (Winterzeit) / 07:30 (Sommerzeit)
[functions."scheduled-agent-briefing"]
  schedule = "30 5 * * *"

# Tagesreflexion-Erinnerung um 19:00 Wiener Zeit. 17:00 UTC = 19:00 Sommerzeit,
# 18:00 UTC = 19:00 Winterzeit. Die Funktion prüft selbst, welcher Lauf passt.
[functions."scheduled-daily-reflection-push"]
  schedule = "0 17,18 * * *"

# Leadership-Challenge: montags 07:00 UTC = 08:00 Wien (Winter) / 09:00 (Sommer)
[functions."scheduled-challenge-push"]
  schedule = "0 7 * * 1"

# Interne Dateien nicht öffentlich ausliefern (Quellcode der Funktionen,
# Datenbank-Skripte, Übergabe-Dokumente, interne Skripte). Die Funktionen
# selbst laufen weiter unter /.netlify/functions/ (mit Punkt).
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/supabase/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/uebergabe/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/skript-5min-geschaeftsmodell.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/skript-5min-mamabusiness.md"
  to = "/404.html"
  status = 404
  force = true
